name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate Room schema
        run: gradle kspDebugKotlin --rerun-tasks
      - name: Compile debug Kotlin
        run: gradle compileDebugKotlin
      - name: Run unit and Room integration tests
        run: gradle testDebugUnitTest
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("JUnit summary: " + ", ".join(f"{k}={v}" for k, v in totals.items()))
          if totals["tests"] == 0:
              raise SystemExit("No JUnit tests were discovered")
          PY
      - name: Run Android lint
        run: gradle lintDebug
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Run Android navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest
      - name: Assemble unsigned release APK
        run: gradle assembleRelease
      - name: Upload unit test reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-room-schemas
          path: |
            app/build/test-results/testDebugUnitTest/
            app/schemas/
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dailyfit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dailyfit-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
